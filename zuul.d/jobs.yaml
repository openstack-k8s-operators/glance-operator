---
- job:
    name: glance-operator-kuttl
    parent: cifmw-base-multinode-kuttl
    attempts: 1
    required-projects:
      - github.com/openstack-k8s-operators/glance-operator
    irrelevant-files: &common-irrelevant-files
      - .*/*.md
      - ^\..*$
      - ^LICENSE$
      - ^OWNERS$
      - ^OWNERS_ALIASES$
      - ^PROJECT$
      - ^README.md$
      - tests?\/functional
      - ^renovate.json$
      - ^docs/
    vars:
      cifmw_install_yamls_sdk_version: v1.42.3
      cifmw_cls_pv_count: 20
      cifmw_kuttl_tests_operator_list:
        - glance

- job:
    name: glance-s2i-content-provider
    parent: s2i-openstack-container-content-provider
    description: |
      Build s2i glance service images for glance-s2i tempest jobs.
    required-projects:
      - name: openstack-k8s-operators/s2i-openstack-containers
        override-checkout: main
    vars:
      s2i_ci_images:
        - glance/glance-api

- job:
    name: glance-s2i-test-swift
    parent: s2i-test-base
    description: |
      Validate speculatively-built s2i glance images with swift
      against a live OpenStack deployment.
    irrelevant-files: *common-irrelevant-files
    vars:
      cifmw_test_operator_tempest_concurrency: 3
      cifmw_test_operator_tempest_include_list: |
        ^tempest.api.image..*
        ^tempest.scenario.test_snapshot_pattern..*
        ^glance_tempest_plugin..*
        ^barbican_tempest_plugin.tests.scenario.test_certificate_validation..*
        ^barbican_tempest_plugin.tests.scenario.test_image_signing.ImageSigningTest..*
        ^tempest.scenario.test_unified_limits.ImageQuotaTest..*
      cifmw_test_operator_tempest_tempestconf_config:
        overrides: |
          image_feature_enabled.import_image True
          service_available.cinder False
          image_signature_verification.enforced False
          image_signature_verification.certificate_validation False

- job:
    name: glance-s2i-test-ceph
    parent: s2i-test-base-ceph
    description: |
      Validate speculatively-built s2i glance images against a live
      HCI OpenStack deployment with Ceph.
    irrelevant-files: *common-irrelevant-files
    vars:
      # The value chosen here (70) is lower than the index used to call
      # control_plane_kustomize_deploy when ceph is used,
      # which makes sure that the kustomize file generated by this hook
      # is correctly applied.
      post_deploy_70_enable_glance_image_cache:
        type: playbook
        source: control_plane_glance_image_cache.yml
      cifmw_cephadm_min_compat_client: 'mimic'
      cifmw_ceph_daemons_layout:
        rgw_enabled: false
        dashboard_enabled: false
        cephfs_enabled: true
        ceph_nfs_enabled: false
      cifmw_test_operator_tempest_concurrency: 3
      cifmw_test_operator_tempest_include_list: |
        ^tempest.api.image..*
        ^tempest.scenario.test_snapshot_pattern..*
        ^glance_tempest_plugin..*
        ^barbican_tempest_plugin.tests.scenario.test_certificate_validation..*
        ^barbican_tempest_plugin.tests.scenario.test_image_signing.ImageSigningTest..*
      cifmw_test_operator_tempest_tempestconf_config:
        overrides: |
          service_available.cinder True
          image_signature_verification.enforced False
          image_signature_verification.certificate_validation False
          image.image_caching_enabled True

- job:
    name: glance-s2i-test-ceph-nomimic
    parent: glance-s2i-test-ceph
    description: |
      Variant of glance-s2i-test-ceph which tests against ceph
      without setting min-compact-client to mimic
    vars:
      cifmw_cephadm_min_compat_client: ''
      cifmw_test_operator_tempest_tempestconf_config:
        overrides: |
          service_available.cinder True
          image_signature_verification.enforced False
          image_signature_verification.certificate_validation False
          volume-feature-enabled.enable_volume_image_dep_tests False

- job:
    name: glance-s2i-test-nfs
    parent: s2i-test-base
    description: |
      Validate speculatively-built s2i glance images against a live
      OpenStack deployment with the file backend backed by an NFS share.
    required-projects:
      - name: github.com/openstack-k8s-operators/glance-operator
        override-checkout: main
    irrelevant-files: *common-irrelevant-files
    vars:
      cifmw_edpm_deploy_nfs: True
      cifmw_edpm_prepare_cindervolumes: ['nfs']
      cifmw_nfs_shares:
       - glance
      # Write access to the share is required
      cifmw_nfs_share_ownership:
        glance:
          owner: '42415'
          group: '42415'
          mode: '0770'
      pre_deploy_80_setup_glance_with_fileNFS_based_backend_using_kustomize:
        type: playbook
        source: control_plane_glance_nfs_setup.yml
      post_deploy_81_kustomize_openstack_CR_to_enable_fileNFS_glance_backend:
        type: playbook
        source: control_plane_glance_nfs_enable.yml
      post_deploy_82_kustomize_and_update_Control_Plane:
        type: playbook
        source: control_plane_kustomize_deploy.yml
      cifmw_test_operator_tempest_concurrency: 3
      cifmw_test_operator_tempest_include_list: |
        ^tempest.api.image..*
        ^tempest.scenario.test_snapshot_pattern..*
        ^glance_tempest_plugin..*
        ^barbican_tempest_plugin.tests.scenario.test_certificate_validation..*
        ^barbican_tempest_plugin.tests.scenario.test_image_signing.ImageSigningTest..*
        ^tempest.api.image.v2.admin.test_image_caching.ImageCachingTest.test_image_caching_cycle
      cifmw_test_operator_tempest_tempestconf_config:
        overrides: |
          service_available.cinder False
          image_signature_verification.enforced False
          image_signature_verification.certificate_validation False

- job:
    name: glance-s2i-test-cindernfs
    parent: s2i-test-base
    # Use a nodeset that provides a more powerful CRC node, because
    # the resources of the CRC node provided by the base job are
    # not enough when the tests executed are slightly more than basics
    nodeset: centos-10-medium-2x-centos-10-crc-cloud-ocp-4-22-1-3xl
    description: |
      Validate speculatively-built s2i glance images against a live
      OpenStack deployment, with the cinder backend (backend by NFS).
    required-projects:
      - name: github.com/openstack-k8s-operators/cinder-operator
        override-checkout: main
      - name: github.com/openstack-k8s-operators/glance-operator
        override-checkout: main
    irrelevant-files: *common-irrelevant-files
    vars:
      cifmw_edpm_deploy_nfs: true
      cifmw_nfs_shares:
        - cinder
        - cinderbackup
      pre_deploy_80_setup_glance_for_cinder_backend_using_kustomize:
        type: playbook
        source: control_plane_glance_cindernfs_setup.yml
      post_deploy_81_kustomize_openstack_CR_to_enable_genericNFS_cinder_backend:
        type: playbook
        source: control_plane_cinder_nfs_enable.yml
      post_deploy_82_kustomize_openstack_CR_to_enable_cinderNFS_glance_backend:
        type: playbook
        source: control_plane_glance_cindernfs_enable.yml
      post_deploy_89_kustomize_and_update_Control_Plane:
        type: playbook
        source: control_plane_kustomize_deploy.yml
      post_deploy_95_increase_volume_quota:
        type: playbook
        source: service-project-more-quota.yml
      cifmw_test_operator_tempest_concurrency: 3
      cifmw_test_operator_tempest_include_list: |
        ^tempest.api.image..*
        ^tempest.scenario.test_snapshot_pattern..*
        ^glance_tempest_plugin..*
        ^barbican_tempest_plugin.tests.scenario.test_certificate_validation..*
        ^barbican_tempest_plugin.tests.scenario.test_image_signing.ImageSigningTest..*
      cifmw_test_operator_tempest_tempestconf_config:
        overrides: |
          compute-feature-enabled.attach_encrypted_volume False
          compute-feature-enabled.volume_multiattach False
          image_signature_verification.enforced False
          image_signature_verification.certificate_validation False
          volume-feature-enabled.volume_revert True
          volume.storage_protocol 'nfs'

- job:
    name: glance-s2i-test-s3
    parent: s2i-test-base
    description: |
      Validate speculatively-built s2i glance images against a live
      OpenStack deployment with the S3 backend. The S3 service is
      provided by swift.
    required-projects:
      - name: github.com/openstack-k8s-operators/glance-operator
        override-checkout: main
    irrelevant-files: *common-irrelevant-files
    vars:
      post_deploy_81_kustomize_openstack_CR_to_enable_S3_glance_backend:
        type: playbook
        source: control_plane_glance_s3_enable.yml
      post_deploy_82_kustomize_and_update_Control_Plane:
        type: playbook
        source: control_plane_kustomize_deploy.yml
      cifmw_test_operator_tempest_concurrency: 3
      cifmw_test_operator_tempest_include_list: |
        ^tempest.api.image..*
        ^tempest.scenario.test_snapshot_pattern..*
        ^glance_tempest_plugin..*
        ^barbican_tempest_plugin.tests.scenario.test_certificate_validation..*
        ^barbican_tempest_plugin.tests.scenario.test_image_signing.ImageSigningTest..*
      cifmw_test_operator_tempest_tempestconf_config:
        overrides: |
          service_available.cinder False
          image_signature_verification.enforced False
          image_signature_verification.certificate_validation False
