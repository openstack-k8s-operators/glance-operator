---
- job:
    name: glance-operator-kuttl
    parent: cifmw-base-multinode-kuttl
    attempts: 1
    required-projects:
      - github.com/openstack-k8s-operators/glance-operator
    irrelevant-files: &common-irrelevant-files
      - .*/*.md
      - ^\..*$
      - ^LICENSE$
      - ^OWNERS$
      - ^OWNERS_ALIASES$
      - ^PROJECT$
      - ^README.md$
      - tests?\/functional
      - ^renovate.json$
      - ^docs/
    vars:
      cifmw_install_yamls_sdk_version: v1.42.3
      cifmw_cls_pv_count: 20
      cifmw_kuttl_tests_operator_list:
        - glance

- job:
    name: glance-operator-antelope-tempest
    parent: podified-multinode-hci-deployment-crc-1comp-backends
    irrelevant-files: *common-irrelevant-files
    vars:
      cifmw_ceph_daemons_layout:
        rgw_enabled: false
        dashboard_enabled: false
        cephfs_enabled: true
        ceph_nfs_enabled: false
      cifmw_install_yamls_sdk_version: v1.42.3
      cifmw_test_operator_tempest_concurrency: 3
      cifmw_test_operator_tempest_include_list: |
        ^tempest.api.image.

- job:
    name: glance-s2i-content-provider
    parent: s2i-openstack-container-content-provider
    description: |
      Build s2i glance service images for glance-s2i tempest jobs.
    required-projects:
      - name: openstack-k8s-operators/s2i-openstack-containers
        override-checkout: main
    vars:
      s2i_ci_images:
        - glance/glance-api

- job:
    name: glance-s2i-test-swift
    parent: s2i-test-base
    description: |
      Validate speculatively-built s2i glance images with swift
      against a live OpenStack deployment.
    irrelevant-files: *common-irrelevant-files
    vars:
      cifmw_test_operator_tempest_concurrency: 3
      cifmw_test_operator_tempest_include_list: |
        ^tempest.api.image..*
        ^tempest.scenario.test_snapshot_pattern..*
        ^glance_tempest_plugin..*
        ^barbican_tempest_plugin.tests.scenario.test_certificate_validation..*
        ^barbican_tempest_plugin.tests.scenario.test_image_signing.ImageSigningTest..*
        ^tempest.scenario.test_unified_limits.ImageQuotaTest..*
      # Reenable when a newer tempest (current main, definitely > 2023.1-last) is available
      cifmw_test_operator_tempest_expected_failures_list: |
        tempest.api.image.v2.admin.test_image_task.ImageTaskCreate.test_task_create_fake_image_location
        tempest.api.image.v2.test_images.ListSharedImagesTest.test_list_images_param_member_status
        tempest.api.image.v2.test_images.BasicOperationsImagesTest.test_register_upload_get_image_file
        setUpClass (tempest.api.image.v2.test_images.ListUserImagesTest)
        tempest.api.image.v2.test_images_negative.ImportImagesNegativeTest.test_image_web_download_import_with_bad_url
        glance_tempest_plugin.tests.rbac.v2.test_project_admin_tests.ImageProjectAdminTests.test_deactivate_image
        glance_tempest_plugin.tests.rbac.v2.test_project_admin_tests.ImageProjectAdminTests.test_reactivate_image
        glance_tempest_plugin.tests.rbac.v2.test_project_admin_tests.ImageProjectAdminTests.test_upload_image
        glance_tempest_plugin.tests.rbac.v2.test_project_members_tests.ImagesProjectMemberTests.test_deactivate_image
        glance_tempest_plugin.tests.rbac.v2.test_project_members_tests.ImagesProjectMemberTests.test_reactivate_image
        glance_tempest_plugin.tests.rbac.v2.test_project_members_tests.ImagesProjectMemberTests.test_upload_image
        glance_tempest_plugin.tests.rbac.v2.test_project_reader_tests.ImagesProjectReaderTests.test_deactivate_image
        glance_tempest_plugin.tests.rbac.v2.test_project_reader_tests.ImagesProjectReaderTests.test_reactivate_image
      cifmw_test_operator_tempest_tempestconf_config:
        overrides: |
          image_feature_enabled.import_image True
          service_available.cinder False
          image_signature_verification.enforced False
          image_signature_verification.certificate_validation False
