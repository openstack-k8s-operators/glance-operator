---
# project template to be used locally for operator testing
- project-template:
    name: glance-operator-s2i-testing
    github-check:
      jobs:
        - glance-s2i-content-provider
        - glance-s2i-test-swift:
            dependencies:
              - openstack-k8s-operators-content-provider
              - glance-s2i-content-provider

# project template to be used in the s2i repository
- project-template:
    name: glance-operator-s2i-component-jobs
    github-check:
      jobs:
        - glance-s2i-test-swift:
            vars:
              content_provider_registry_ip: "{{ s2i_content_provider_registry_ip }}"
            files:
              - ^containers/base/
              - ^containers/glance/
            dependencies:
              - s2i-openstack-container-content-provider
              - s2i-openstack-container-consumer-smoke

- project:
    name: openstack-k8s-operators/glance-operator
    templates:
      - glance-operator-s2i-testing
    github-check:
      jobs:
        - openstack-k8s-operators-content-provider:
            vars:
              cifmw_install_yamls_sdk_version: v1.41.1
        - glance-operator-kuttl:
            dependencies:
              - openstack-k8s-operators-content-provider
        - glance-operator-antelope-tempest:
            dependencies:
              - openstack-k8s-operators-content-provider
